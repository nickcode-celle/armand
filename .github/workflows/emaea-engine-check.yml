name: EMÆÄ engine check

on:
  push:
    branches:
      - emaea-evolution-engine-b-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Check EMÆÄ engine
        run: npm run check:entity
      - name: Build EMÆÄ production image
        run: docker build -f Dockerfile.entity -t emaea-engine-ci .
      - name: Smoke-test EMÆÄ production image with local fallback storage
        run: |
          mkdir -p /tmp/emaea-data
          docker run -d --rm --name emaea-engine-ci-run -p 4458:4401 -e ENTITY_STORAGE_DIR=/data -v /tmp/emaea-data:/data emaea-engine-ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4458/health > /tmp/emaea-health.json; then break; fi
            sleep 1
          done
          cat /tmp/emaea-health.json
          node -e "const h=require('/tmp/emaea-health.json'); if(!h.ok||h.storage!=='local-sharded'||h.storage_root!=='/data') process.exit(1)"
          docker stop emaea-engine-ci-run
